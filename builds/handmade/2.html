<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shelf</title>
<style>
  :root { --bg:#F6F1E8; --ink:#1b1a17; --soft:#6f6a60; --brass:#B08A3E; --brass-deep:#8a6a2a; --line:rgba(27,26,23,.12); --card:#fffdf8; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; overflow:hidden; }
  .app { position:fixed; inset:0; display:grid; grid-template-rows:auto 1fr; }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 16px 8px; }
  header h1 { margin:0; font-weight:500; font-size:17px; letter-spacing:.01em; }
  header h1 span { color:var(--soft); font-weight:400; font-size:13px; margin-left:8px; }
  .hud { display:flex; gap:14px; align-items:center; font-variant-numeric:tabular-nums; }
  .score { font-size:26px; font-weight:500; line-height:1; }
  .score small { display:block; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--soft); margin-top:3px; }
  .owner { width:min(42vw,220px); }
  .owner small { display:block; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--soft); margin-bottom:5px; }
  .bar { height:8px; border-radius:8px; background:var(--line); overflow:hidden; }
  .bar i { display:block; height:100%; width:100%; background:var(--brass); border-radius:8px; transition:width .25s linear; }
  .bar.hurry i { background:#b3482c; }
  .stage { position:relative; margin:0 12px 12px; border:1px solid var(--line); border-radius:18px; background:var(--card); overflow:hidden; box-shadow:0 20px 50px -30px rgba(27,26,23,.35); }
  canvas { display:block; width:100%; height:100%; touch-action:none; cursor:pointer; }
  .overlay { position:absolute; inset:0; display:grid; place-content:center; text-align:center; padding:24px; background:rgba(246,241,232,.86); backdrop-filter:blur(3px); }
  .overlay[hidden] { display:none; }
  .overlay h2 { font-weight:500; font-size:clamp(24px,5vw,36px); margin:0 0 8px; letter-spacing:-.01em; }
  .overlay p { margin:0 0 18px; color:var(--soft); font-size:15px; max-width:34ch; line-height:1.5; }
  .overlay .big { font-size:clamp(44px,12vw,88px); font-weight:500; line-height:1; margin:4px 0 2px; color:var(--brass-deep); font-variant-numeric:tabular-nums; }
  button { font:inherit; font-size:15px; font-weight:500; padding:13px 22px; min-height:46px; border-radius:14px; border:0; background:var(--ink); color:#fff; cursor:pointer; }
  button:active { transform:translateY(1px); }
  .toast { position:absolute; left:50%; top:14px; transform:translateX(-50%); padding:7px 12px; border-radius:999px; background:var(--ink); color:#fff; font-size:12.5px; opacity:0; transition:opacity .2s; pointer-events:none; white-space:nowrap; }
  .toast.show { opacity:1; }
  .credit { position:fixed; right:12px; bottom:6px; font-size:11px; color:var(--soft); opacity:.75; pointer-events:none; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Shelf <span>the owner went to get coffee</span></h1>
    <div class="hud">
      <div class="owner"><small id="ownerLabel">owner returns in</small><div class="bar" id="bar"><i id="fill"></i></div></div>
      <div class="score"><span id="score">0</span><small>on the floor</small></div>
    </div>
  </header>
  <div class="stage" id="stage">
    <canvas id="c"></canvas>
    <div class="toast" id="toast"></div>
    <div class="overlay" id="intro">
      <h2>Knock it all off.</h2>
      <p>Tap a thing to nudge it. Heavy things take a few nudges. The owner is back in 30 seconds and will count what is on the floor. So will you.</p>
      <button id="start">Begin</button>
    </div>
    <div class="overlay" id="over" hidden>
      <h2 id="overTitle">The owner is home.</h2>
      <div class="big" id="finalScore">0</div>
      <p id="overLine"></p>
      <button id="again">Again</button>
    </div>
  </div>
</div>
<div class="credit">built by caturn</div>
<script>
(function(){
  var cv=document.getElementById('c'),ctx=cv.getContext('2d'),stage=document.getElementById('stage');
  var scoreEl=document.getElementById('score'),fill=document.getElementById('fill'),bar=document.getElementById('bar'),ownerLabel=document.getElementById('ownerLabel');
  var intro=document.getElementById('intro'),over=document.getElementById('over'),toast=document.getElementById('toast');
  var W=0,H=0,DPR=1,items=[],shards=[],paw={x:-99,y:-99,t:0},running=false,score=0,T=30,left=T,last=0,raf=0,shelves=[],toastT=0,combo=0,comboT=0,best=0;
  var AC=null;
  function audio(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; } } if(AC&&AC.state==='suspended') AC.resume(); }
  function tone(f,d,type,g){ if(!AC) return; var o=AC.createOscillator(),v=AC.createGain(); o.type=type||'sine'; o.frequency.value=f; v.gain.value=g||.08; o.connect(v); v.connect(AC.destination); var t=AC.currentTime; v.gain.setValueAtTime(g||.08,t); v.gain.exponentialRampToValueAtTime(.0001,t+d); o.start(t); o.stop(t+d); }
  function crash(){ if(!AC) return; var n=AC.sampleRate*.25,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0); for(var i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.2); var s=AC.createBufferSource(),v=AC.createGain(),f=AC.createBiquadFilter(); f.type='highpass'; f.frequency.value=1800; s.buffer=b; v.gain.value=.25; s.connect(f); f.connect(v); v.connect(AC.destination); s.start(); tone(2400+Math.random()*800,.12,'triangle',.05); }
  function thud(){ if(!AC) return; tone(110,.18,'sine',.18); tone(70,.22,'triangle',.1); }
  function clink(p){ tone(900+p*400,.07,'triangle',.05); }

  var KINDS=[
    {name:'vase',w:.11,h:.26,mass:2,fragile:true,color:'#9fb8c8',draw:drawVase},
    {name:'mug',w:.12,h:.14,mass:1,fragile:true,color:'#d9b48f',draw:drawMug},
    {name:'plant',w:.14,h:.24,mass:2,fragile:false,color:'#6f8f5a',draw:drawPlant},
    {name:'books',w:.16,h:.17,mass:3,fragile:false,color:'#b3482c',draw:drawBooks},
    {name:'globe',w:.12,h:.15,mass:1,fragile:true,color:'#c9d6e2',draw:drawGlobe},
    {name:'frame',w:.13,h:.17,mass:1,fragile:true,color:'#B08A3E',draw:drawFrame},
    {name:'trophy',w:.10,h:.22,mass:2,fragile:false,color:'#d4b24c',draw:drawTrophy},
    {name:'candle',w:.07,h:.16,mass:1,fragile:false,color:'#f0e6d2',draw:drawCandle},
    {name:'radio',w:.17,h:.13,mass:3,fragile:false,color:'#7a6f62',draw:drawRadio},
    {name:'cat',w:.10,h:.16,mass:1,fragile:true,color:'#e9e1d2',draw:drawCat}
  ];
  function resize(){ var r=stage.getBoundingClientRect(); DPR=Math.min(2,window.devicePixelRatio||1); W=Math.max(1,Math.floor(r.width)); H=Math.max(1,Math.floor(r.height)); cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); layout(); }
  function layout(){ var n=H<520?2:3; shelves=[]; var top=H*.16,gap=(H*.62-top)/(n-1||1); for(var i=0;i<n;i++) shelves.push({y:top+i*gap,x:W*.08,w:W*.84}); }
  function reset(){ score=0; left=T; combo=0; items=[]; shards=[]; scoreEl.textContent='0'; fill.style.width='100%'; bar.classList.remove('hurry'); ownerLabel.textContent='owner returns in';
    var unit=Math.min(W,H*1.2);
    shelves.forEach(function(s,si){ var count=W<420?3:4, x=s.x+8; var pool=KINDS.slice().sort(function(){return Math.random()-.5;}).slice(0,count); var slot=s.w/count;
      pool.forEach(function(k,i){ var w=k.w*unit*.55,h=k.h*unit*.55; var cx=s.x+slot*i+slot/2+(Math.random()-.5)*slot*.2; items.push({k:k,x:cx-w/2,y:s.y-h,w:w,h:h,vx:0,vy:0,rot:0,vr:0,state:'shelf',nudges:0,need:k.mass,shelf:si,tilt:0,wob:0}); });
    });
  }
  function start(){ audio(); intro.hidden=true; over.hidden=true; reset(); running=true; last=performance.now(); cancelAnimationFrame(raf); raf=requestAnimationFrame(loop); say('go'); }
  function end(){ running=false; over.hidden=false; document.getElementById('finalScore').textContent=score; best=Math.max(best,score); var total=items.length; var line= score===0?'Nothing on the floor. The owner suspects nothing. You are not a cat.':score<total/2?'A respectable start. The owner sighs and picks things up. You watch.':score<total?'Most of it. The owner says your name in the voice. You have never heard your name.':'All of it. The owner stands in the doorway for a long time. Worth it.'; document.getElementById('overLine').textContent=line+(best>score?' Best so far: '+best+'.':''); thud(); }
  function say(t){ toast.textContent=t; toast.classList.add('show'); toastT=1.2; }
  function floorY(){ return H-Math.max(28,H*.09); }
  function nudge(it,px){ it.nudges++; var dir=px<it.x+it.w/2?1:-1; it.wob=1; it.tilt+=dir*.12;
    if(it.nudges>=it.need){ it.state='air'; it.vx=dir*(30+Math.random()*50); it.vy=-120-Math.random()*60; it.vr=dir*(2+Math.random()*3); clink(1); paw.t=1; }
    else { clink(it.nudges/it.need); paw.t=1; say(it.k.name+': '+(it.need-it.nudges)+' more'); }
  }
  function hit(px,py){ if(!running) return; paw.x=px; paw.y=py; paw.t=1; for(var i=items.length-1;i>=0;i--){ var it=items[i]; if(it.state!=='shelf') continue; if(px>=it.x-12&&px<=it.x+it.w+12&&py>=it.y-12&&py<=it.y+it.h+12){ nudge(it,px); return; } } tone(200,.05,'sine',.03); }
  function pointer(e){ var r=cv.getBoundingClientRect(),p=e.touches?e.touches[0]:e; hit((p.clientX-r.left),(p.clientY-r.top)); e.preventDefault(); }
  cv.addEventListener('pointerdown',pointer);
  function loop(now){ var dt=Math.min(.05,(now-last)/1000); last=now; step(dt); draw(); if(running||shards.length||items.some(function(i){return i.state==='air';})) raf=requestAnimationFrame(loop); }
  function step(dt){ if(running){ left-=dt; fill.style.width=Math.max(0,left/T*100)+'%'; if(left<6&&!bar.classList.contains('hurry')){ bar.classList.add('hurry'); ownerLabel.textContent='footsteps'; say('footsteps in the hall'); } if(left<=0){ left=0; end(); } }
    if(toastT>0){ toastT-=dt; if(toastT<=0) toast.classList.remove('show'); }
    if(comboT>0){ comboT-=dt; if(comboT<=0) combo=0; }
    paw.t=Math.max(0,paw.t-dt*3);
    var fy=floorY();
    items.forEach(function(it){ it.wob=Math.max(0,it.wob-dt*4); it.tilt*=Math.pow(.02,dt);
      if(it.state==='air'){ it.vy+=1400*dt; it.x+=it.vx*dt; it.y+=it.vy*dt; it.rot+=it.vr*dt;
        if(it.x<4){ it.x=4; it.vx=Math.abs(it.vx)*.5; } if(it.x+it.w>W-4){ it.x=W-4-it.w; it.vx=-Math.abs(it.vx)*.5; }
        if(it.y+it.h>=fy){ it.y=fy-it.h; land(it); }
      }
    });
    shards.forEach(function(s){ s.vy+=1200*dt; s.x+=s.vx*dt; s.y+=s.vy*dt; s.r+=s.vr*dt; s.life-=dt; if(s.y>fy-2){ s.y=fy-2; s.vy=-s.vy*.3; s.vx*=.7; } });
    shards=shards.filter(function(s){return s.life>0;});
  }
  function land(it){ it.state='floor'; it.vx=0; it.vy=0; score++; scoreEl.textContent=score; combo++; comboT=2;
    if(it.k.fragile){ it.broken=true; crash(); for(var i=0;i<14;i++) shards.push({x:it.x+it.w/2,y:it.y+it.h/2,vx:(Math.random()-.5)*260,vy:-Math.random()*220,r:Math.random()*6,vr:(Math.random()-.5)*10,s:3+Math.random()*5,c:it.k.color,life:1.2+Math.random()}); say(combo>1?combo+' in a row':'crash'); }
    else { thud(); say(combo>1?combo+' in a row':'thud'); }
  }
  function draw(){ ctx.clearRect(0,0,W,H); var fy=floorY();
    var g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#fbf7ef'); g.addColorStop(1,'#efe6d6'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#e7dcc7'; ctx.fillRect(0,fy,W,H-fy); ctx.fillStyle='rgba(27,26,23,.08)'; ctx.fillRect(0,fy,W,2);
    shelves.forEach(function(s){ ctx.fillStyle='rgba(27,26,23,.08)'; ctx.fillRect(s.x+4,s.y+6,s.w,10); ctx.fillStyle='#b99264'; ctx.fillRect(s.x,s.y,s.w,10); ctx.fillStyle='#a07c50'; ctx.fillRect(s.x,s.y+10,s.w,4); });
    items.forEach(function(it){ ctx.save(); ctx.translate(it.x+it.w/2,it.y+it.h); var r=it.rot+it.tilt+Math.sin(performance.now()/40)*it.wob*.06; if(it.state==='floor'&&it.broken){ ctx.rotate(it.rot); ctx.globalAlpha=.55; } else ctx.rotate(r); if(it.state==='floor'&&!it.broken) ctx.rotate(it.rot%6.28>3?1.4:-1.4); it.k.draw(ctx,it.w,it.h,it.k.color,it.broken); ctx.restore(); });
    shards.forEach(function(s){ ctx.save(); ctx.translate(s.x,s.y); ctx.rotate(s.r); ctx.fillStyle=s.c; ctx.globalAlpha=Math.min(1,s.life); ctx.fillRect(-s.s/2,-s.s/2,s.s,s.s*.6); ctx.restore(); });
    if(paw.t>0){ ctx.save(); ctx.globalAlpha=paw.t; ctx.translate(paw.x,paw.y); ctx.fillStyle='#e9e1d2'; ctx.strokeStyle='#1b1a17'; ctx.lineWidth=1.5; ellipse(0,6,13,10); [[-9,-6],[-3,-11],[4,-11],[10,-6]].forEach(function(p){ ellipse(p[0],p[1],4,4.5); }); ctx.restore(); }
  }
  function ellipse(x,y,rx,ry){ ctx.beginPath(); ctx.ellipse(x,y,rx,ry,0,0,6.283); ctx.fill(); ctx.stroke(); }
  function base(c){ c.strokeStyle='#1b1a17'; c.lineWidth=1.5; c.lineJoin='round'; }
  function drawVase(c,w,h,col){ base(c); c.fillStyle=col; c.beginPath(); c.moveTo(-w*.3,0); c.lineTo(-w*.5,-h*.55); c.quadraticCurveTo(-w*.1,-h*.75,-w*.25,-h); c.lineTo(w*.25,-h); c.quadraticCurveTo(w*.1,-h*.75,w*.5,-h*.55); c.lineTo(w*.3,0); c.closePath(); c.fill(); c.stroke(); c.fillStyle='rgba(255,255,255,.35)'; c.fillRect(-w*.32,-h*.6,w*.1,h*.4); }
  function drawMug(c,w,h,col){ base(c); c.fillStyle=col; c.beginPath(); c.roundRect(-w*.4,-h,w*.7,h,[4,4,8,8]); c.fill(); c.stroke(); c.beginPath(); c.arc(w*.35,-h*.55,w*.18,-1.4,1.4); c.stroke(); c.fillStyle='#5a3a22'; c.beginPath(); c.ellipse(-w*.05,-h*.92,w*.3,h*.07,0,0,6.283); c.fill(); }
  function drawPlant(c,w,h,col){ base(c); c.fillStyle='#c98a5a'; c.beginPath(); c.moveTo(-w*.4,-h*.42); c.lineTo(w*.4,-h*.42); c.lineTo(w*.3,0); c.lineTo(-w*.3,0); c.closePath(); c.fill(); c.stroke(); c.fillStyle=col; for(var i=-2;i<=2;i++){ c.beginPath(); c.ellipse(i*w*.16,-h*.65-Math.abs(i)*-h*.05,w*.13,h*.28,i*.35,0,6.283); c.fill(); c.stroke(); } }
  function drawBooks(c,w,h,col){ base(c); var cols=[col,'#2f4f6f','#B08A3E']; for(var i=0;i<3;i++){ c.fillStyle=cols[i]; c.beginPath(); c.rect(-w*.5+i*w*.33,-h+i*h*.08,w*.3,h-i*h*.08); c.fill(); c.stroke(); c.fillStyle='rgba(255,255,255,.5)'; c.fillRect(-w*.5+i*w*.33+w*.08,-h*.75,w*.14,2); } }
  function drawGlobe(c,w,h,col){ base(c); c.fillStyle='#7a6f62'; c.beginPath(); c.roundRect(-w*.35,-h*.22,w*.7,h*.22,3); c.fill(); c.stroke(); c.fillStyle=col; c.beginPath(); c.arc(0,-h*.6,w*.42,0,6.283); c.fill(); c.stroke(); c.fillStyle='#fff'; for(var i=0;i<6;i++){ c.beginPath(); c.arc(-w*.25+i*w*.1,-h*.72+(i%2)*h*.14,1.6,0,6.283); c.fill(); } c.fillStyle='#6f8f5a'; c.beginPath(); c.moveTo(-w*.12,-h*.32); c.lineTo(0,-h*.58); c.lineTo(w*.12,-h*.32); c.closePath(); c.fill(); }
  function drawFrame(c,w,h,col){ base(c); c.fillStyle=col; c.beginPath(); c.rect(-w*.5,-h,w,h); c.fill(); c.stroke(); c.fillStyle='#fbf7ef'; c.fillRect(-w*.38,-h*.86,w*.76,h*.72); c.fillStyle='#9fb8c8'; c.fillRect(-w*.38,-h*.86,w*.76,h*.4); c.fillStyle='#6f8f5a'; c.beginPath(); c.moveTo(-w*.38,-h*.14); c.lineTo(-w*.1,-h*.5); c.lineTo(w*.15,-h*.3); c.lineTo(w*.38,-h*.46); c.lineTo(w*.38,-h*.14); c.closePath(); c.fill(); }
  function drawTrophy(c,w,h,col){ base(c); c.fillStyle='#1b1a17'; c.fillRect(-w*.4,-h*.12,w*.8,h*.12); c.fillStyle=col; c.beginPath(); c.moveTo(-w*.45,-h); c.lineTo(w*.45,-h); c.quadraticCurveTo(w*.4,-h*.4,0,-h*.3); c.quadraticCurveTo(-w*.4,-h*.4,-w*.45,-h); c.closePath(); c.fill(); c.stroke(); c.fillRect(-w*.08,-h*.3,w*.16,h*.18); c.beginPath(); c.arc(-w*.5,-h*.78,w*.14,1.2,4.9); c.stroke(); c.beginPath(); c.arc(w*.5,-h*.78,w*.14,-1.7,2); c.stroke(); }
  function drawCandle(c,w,h,col){ base(c); c.fillStyle=col; c.beginPath(); c.roundRect(-w*.5,-h*.8,w,h*.8,3); c.fill(); c.stroke(); c.fillStyle='#f0b429'; c.beginPath(); c.ellipse(0,-h*.9,w*.18,h*.12,0,0,6.283); c.fill(); c.fillStyle='#fff3c4'; c.beginPath(); c.ellipse(0,-h*.88,w*.08,h*.06,0,0,6.283); c.fill(); }
  function drawRadio(c,w,h,col){ base(c); c.fillStyle=col; c.beginPath(); c.roundRect(-w*.5,-h,w,h,6); c.fill(); c.stroke(); c.fillStyle='#f0e6d2'; c.beginPath(); c.roundRect(-w*.42,-h*.8,w*.5,h*.5,3); c.fill(); c.fillStyle='#1b1a17'; c.beginPath(); c.arc(w*.28,-h*.55,w*.1,0,6.283); c.fill(); c.strokeStyle='#1b1a17'; c.beginPath(); c.moveTo(w*.3,-h); c.lineTo(w*.45,-h*1.5); c.stroke(); }
  function drawCat(c,w,h,col){ base(c); c.fillStyle=col; c.beginPath(); c.ellipse(0,-h*.35,w*.45,h*.35,0,0,6.283); c.fill(); c.stroke(); c.beginPath(); c.arc(0,-h*.78,w*.3,0,6.283); c.fill(); c.stroke(); c.beginPath(); c.moveTo(-w*.28,-h*.9); c.lineTo(-w*.22,-h*1.08); c.lineTo(-w*.08,-h*.98); c.closePath(); c.moveTo(w*.28,-h*.9); c.lineTo(w*.22,-h*1.08); c.lineTo(w*.08,-h*.98); c.closePath(); c.fill(); c.stroke(); c.fillStyle='#1b1a17'; c.beginPath(); c.arc(-w*.1,-h*.8,1.6,0,6.283); c.arc(w*.1,-h*.8,1.6,0,6.283); c.fill(); c.strokeStyle='#B08A3E'; c.lineWidth=2.5; c.beginPath(); c.ellipse(0,-h*.42,w*.6,h*.14,0,0,6.283); c.stroke(); }
  document.getElementById('start').addEventListener('click',start);
  document.getElementById('again').addEventListener('click',start);
  window.addEventListener('resize',function(){ resize(); if(!running) draw(); });
  resize(); reset(); draw();
})();
</script>
</body>
</html>
