name: Caturn tick
on:
  schedule:
    - cron: "7 * * * *"   # hourly; GitHub delays schedules by hours, so each run loops ticks itself (see CATURN_LOOP_TICKS)
  push:
    branches: [master]
    paths: [".kick"]        # an hourly routine bumps this file to start a loop; GitHub's own cron is unreliable
  workflow_dispatch:
    inputs:
      say:
        description: "Send this text as a one-off test post to X (leave empty for a normal tick)"
        required: false
        default: ""
      check:
        description: "Only verify the API key and balance, post nothing"
        type: boolean
        required: false
        default: false
permissions:
  contents: write
concurrency:
  group: caturn-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'loop' }}
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: master }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Sketch tooling (playwright drives the runner's Chrome; gifenc encodes)
        run: npm i --no-save --no-audit --no-fund playwright@1.49.1 gifenc@1.0.3
      - name: Think (loops CATURN_LOOP_TICKS times, 15 min apart, committing after each)
        env:
          ORBIO_API_KEY: ${{ secrets.ORBIO_API_KEY }}
          CATURN_AGENT_ID: ${{ vars.CATURN_AGENT_ID || secrets.CATURN_AGENT_ID }}
          CATURN_MODEL: ${{ vars.CATURN_MODEL }}
          CATURN_DAILY_CAP: ${{ vars.CATURN_DAILY_CAP }}
          CATURN_FULL_VOLUME_USD: ${{ vars.CATURN_FULL_VOLUME_USD }}
          CATURN_POST_INTERVAL_MIN: ${{ vars.CATURN_POST_INTERVAL_MIN }}
          CATURN_TAG_HANDLES: ${{ vars.CATURN_TAG_HANDLES }}      # comma-separated handles to tag now and then, on top of what Caturn finds itself
          CATURN_TAG_EVERY: ${{ vars.CATURN_TAG_EVERY }}          # tag someone in one post in N (default 5)
          CATURN_REPLY_EVERY: ${{ vars.CATURN_REPLY_EVERY }}      # look for something to answer every N posts (default 2)
          CATURN_SAY: ${{ github.event.inputs.say }}
          KICK_TOKEN: ${{ secrets.KICK_TOKEN }}
          CATURN_CHECK: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          FORCE_FIRST: ${{ github.event_name != 'schedule' && '1' || '' }}
          LOOP: ${{ (github.event.inputs.say == '' && (vars.CATURN_LOOP_TICKS || secrets.CATURN_LOOP_TICKS || '22')) || '1' }}
        run: |
          git config user.name "caturn-bot"
          git config user.email "caturn-bot@users.noreply.github.com"
          n="${LOOP:-1}"; [ "$n" -ge 1 ] 2>/dev/null || n=1
          for i in $(seq 1 "$n"); do
            git pull -q --rebase origin master || true
            if [ "$i" -eq 1 ]; then export CATURN_FORCE="$FORCE_FIRST"; else export CATURN_FORCE=""; fi
            node agent/run.mjs
            git add data/feed.json
            git diff --cached --quiet || (git commit -q -m "caturn: tick" && git push -q origin HEAD:master) || true
            if [ "$i" -lt "$n" ]; then sleep 900; fi
          done
      - name: Kick the next loop (needs the KICK_TOKEN secret; a push with GITHUB_TOKEN cannot start workflows)
        if: ${{ always() && github.event.inputs.say == '' }}
        env:
          KICK_TOKEN: ${{ secrets.KICK_TOKEN }}
        run: |
          if [ -z "$KICK_TOKEN" ]; then echo "KICK_TOKEN not set; relying on the external kicker"; exit 0; fi
          git fetch -q origin master && git checkout -q -B master origin/master
          date -u +%FT%TZ > .kick
          git add .kick && git commit -q -m "kick: next loop" || exit 0
          git push -q "https://x-access-token:${KICK_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:master
