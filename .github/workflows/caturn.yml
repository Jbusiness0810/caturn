name: Caturn tick
on:
  schedule:
    - cron: "7 * * * *"   # hourly; GitHub delays schedules by hours, so each run loops ticks itself (see CATURN_LOOP_TICKS)
  push:
    branches: [master]
    paths: [".kick"]        # an hourly routine bumps this file to start a loop; GitHub's own cron is unreliable
  workflow_dispatch:
    inputs:
      say:
        description: "Send this text as a one-off test post to X (leave empty for a normal tick)"
        required: false
        default: ""
      check:
        description: "Only verify the API key and balance, post nothing"
        type: boolean
        required: false
        default: false
permissions:
  contents: write
concurrency:
  group: caturn-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'loop' }}
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: master }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Sketch tooling (playwright drives the runner's Chrome; gifenc encodes)
        run: npm i --no-save --no-audit --no-fund playwright@1.49.1 gifenc@1.0.3
      - name: Think (loops CATURN_LOOP_TICKS times, CATURN_TICK_MIN apart, committing after each)
        env:
          ORBIO_API_KEY: ${{ secrets.ORBIO_API_KEY }}
          CATURN_AGENT_ID: ${{ vars.CATURN_AGENT_ID || secrets.CATURN_AGENT_ID }}
          CATURN_MODEL: ${{ vars.CATURN_MODEL }}
          CATURN_DAILY_CAP: ${{ vars.CATURN_DAILY_CAP }}
          CATURN_FULL_VOLUME_USD: ${{ vars.CATURN_FULL_VOLUME_USD }}
          CATURN_POST_INTERVAL_MIN: "10"                          # a post or reply every 10 minutes (aggressive, for now)
          CATURN_TICK_MIN: "10"                                    # ticks every 10 minutes, so each tick can post
          CATURN_TAG_HANDLES: ${{ vars.CATURN_TAG_HANDLES }}      # comma-separated handles to tag now and then, on top of what Caturn finds itself
          CATURN_TAG_EVERY: ${{ vars.CATURN_TAG_EVERY }}          # tag someone in one post in N (default 8)
          CATURN_REPLY_EVERY: ${{ vars.CATURN_REPLY_EVERY }}      # look for something to answer every N posts (default 2)
          CATURN_REPLY_ACCOUNTS: ${{ vars.CATURN_REPLY_ACCOUNTS }} # accounts answered first (default 0x_aster,orbiodotso)
          X_API_KEY: ${{ secrets.X_API_KEY }}                      # X developer app for @caturn_rh: with all four set, replies thread for real
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          CATURN_FOUND_SKETCHES: ${{ vars.CATURN_FOUND_SKETCHES }} # 0 turns off the openprocessing art experiment
          CATURN_FOUND_ARTISTS: ${{ vars.CATURN_FOUND_ARTISTS }}   # openprocessing user ids to look at first (takawo is 6533)
          CATURN_FOUND_CURATORS: ${{ vars.CATURN_FOUND_CURATORS }} # whose hearted sketches to draw from (default takawo, 6533)
          CATURN_FOUND_MIN_HEARTS: ${{ vars.CATURN_FOUND_MIN_HEARTS }} # a found sketch needs this many hearts (default 12)
          CATURN_FOUND_LICENSES: ${{ vars.CATURN_FOUND_LICENSES }} # default cc0,by,by-sa; add by-nc-sa only if you accept non-commercial terms
          CATURN_SAY: ${{ github.event.inputs.say }}
          KICK_TOKEN: ${{ secrets.KICK_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}                    # lets gh upload sketch GIFs to the rolling "sketches" release
          CATURN_CHECK: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          FORCE_FIRST: ${{ github.event_name != 'schedule' && '1' || '' }}
          LOOP: ${{ (github.event.inputs.say == '' && (vars.CATURN_LOOP_TICKS || secrets.CATURN_LOOP_TICKS || '22')) || '1' }}
        run: |
          git config user.name "caturn-bot"
          git config user.email "caturn-bot@users.noreply.github.com"
          n="${LOOP:-1}"; [ "$n" -ge 1 ] 2>/dev/null || n=1
          # The live feed lives as an asset on the rolling "sketches" release, not in git: a commit per tick would
          # trigger a Vercel build per tick and blow the daily deployment limit. Git keeps a snapshot at the end of each loop.
          REL=sketches; REPO="$GITHUB_REPOSITORY"
          gh release view "$REL" -R "$REPO" >/dev/null 2>&1 || gh release create "$REL" -R "$REPO" -t "Caturn sketches" -n "Generative sketches drawn by the agent, and the live feed. Rolling." || true
          for i in $(seq 1 "$n"); do
            git pull -q --rebase origin master || true
            rm -f /tmp/feed.json; gh release download "$REL" -R "$REPO" -p feed.json -O /tmp/feed.json 2>/dev/null && node -e 'JSON.parse(require("fs").readFileSync("/tmp/feed.json","utf8"))' && cp /tmp/feed.json data/feed.json || echo "no live feed on the release yet; starting from the repo copy"
            if [ "$i" -eq 1 ]; then export CATURN_FORCE="$FORCE_FIRST"; else export CATURN_FORCE=""; fi
            node agent/run.mjs
            gh release upload "$REL" data/feed.json -R "$REPO" --clobber || echo "feed upload failed; the repo copy is behind"
            if [ "$i" -lt "$n" ]; then sleep "$(( ${CATURN_TICK_MIN:-15} * 60 ))"; fi
          done
          # One git snapshot per loop, so history survives even if the release is ever deleted.
          git add data/feed.json
          git diff --cached --quiet || (git commit -q -m "caturn: feed snapshot" && git push -q origin HEAD:master) || true
      - name: Kick the next loop (needs the KICK_TOKEN secret; a push with GITHUB_TOKEN cannot start workflows)
        if: ${{ always() && github.event.inputs.say == '' }}
        env:
          KICK_TOKEN: ${{ secrets.KICK_TOKEN }}
        run: |
          if [ -z "$KICK_TOKEN" ]; then echo "KICK_TOKEN not set; relying on the external kicker"; exit 0; fi
          git fetch -q origin master && git checkout -q -B master origin/master
          date -u +%FT%TZ > .kick
          git add .kick && git commit -q -m "kick: next loop" || exit 0
          git push -q "https://x-access-token:${KICK_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:master
